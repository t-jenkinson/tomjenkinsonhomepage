<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tom Jenkinson</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
<style>
  :root {
    --white: #ffffff;
    --black: #0a0a0a;
    --sage: #7d9a82;
    --gray-100: rgba(10, 10, 10, 1);
    --gray-70: rgba(10, 10, 10, 0.7);
    --gray-40: rgba(10, 10, 10, 0.4);
    --gray-15: rgba(10, 10, 10, 0.15);
    --gray-08: rgba(10, 10, 10, 0.08);
    --gray-04: rgba(10, 10, 10, 0.04);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  #grain-container {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 500;
    mix-blend-mode: multiply;
    opacity: 0.07;
  }

  body {
    font-family: 'Archivo', sans-serif;
    background: var(--white);
    color: var(--black);
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    text-transform: uppercase;
    letter-spacing: -0.02em;
  }

  /* ── FLOATING MENU ── */
  nav {
    position: fixed;
    top: 20px;
    right: 24px;
    z-index: 100;
    display: flex;
    align-items: center;
    gap: 28px;
  }

  .nav-links {
    display: flex;
    gap: 24px;
    list-style: none;
  }

  .nav-links a {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.02em;
    color: var(--black);
    text-decoration: none;
    opacity: 0.4;
    transition: opacity 0.3s;
  }

  .nav-links a:hover { opacity: 1; }

  /* ── HOVER TITLE (typed in on nav-item hover; sits where socials used to) ── */
  .hover-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: clamp(16px, 2.2vw, 22px);
    font-weight: 500;
    letter-spacing: 0.14em;
    line-height: 1;
    color: var(--black);
    margin-top: 32px;
    min-height: 1.2em;
    text-align: center;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .hover-title.active::after {
    content: '_';
    display: inline-block;
    margin-left: 6px;
    color: var(--sage);
    animation: blink 0.6s step-end infinite;
    font-weight: 400;
  }

  body.video-mode .hover-title { color: var(--white); }
  body.video-mode .hover-title.active::after { color: var(--sage); }

  /* ── SOCIAL ICONS (pushed below hover title) ── */
  .socials {
    display: flex;
    justify-content: center;
    gap: 14px;
    margin-top: 56px;
    opacity: 0;
    transition: opacity 0.6s ease;
  }

  .socials.revealed {
    opacity: 1;
  }

  .socials a {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1.5px solid var(--gray-15);
    color: var(--black);
    opacity: 0.4;
    text-decoration: none;
    transition: all 0.35s cubic-bezier(0.23, 1, 0.32, 1);
  }

  .socials a:hover {
    opacity: 1;
    color: var(--sage);
    border-color: var(--sage);
    transform: scale(1.3) rotate(6deg);
  }

  .socials a svg {
    width: 15px;
    height: 15px;
    fill: currentColor;
    transition: fill 0.35s;
  }

  /* ── MAIN CANVAS ── */
  .canvas {
    position: relative;
    width: 100%;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding-top: 0;
  }

  /* ── CENTER CONTENT ── */
  .center-content {
    position: relative;
    z-index: 10;
    text-align: center;
    max-width: 700px;
    padding: 40px 24px;
  }

  .name {
    font-size: clamp(36px, 7vw, 80px);
    font-weight: 900;
    letter-spacing: -0.05em;
    line-height: 0.9;
    color: var(--black);
    margin-bottom: 28px;
    white-space: nowrap;
  }

  .name .char {
    display: inline-block;
    opacity: 0;
    transform: translateY(100%);
  }

  .name .char.revealed {
    opacity: 1;
    transform: translateY(0);
    transition: opacity 0.05s, transform 0.2s cubic-bezier(0.23, 1, 0.32, 1);
  }

  .name .space {
    display: inline-block;
    width: 0.25em;
  }

  .intro {
    font-size: clamp(11px, 1.4vw, 13px);
    font-weight: 500;
    line-height: 1.7;
    color: var(--black);
    opacity: 0;
    max-width: 460px;
    margin: 0 auto;
    letter-spacing: 0.01em;
    transition: opacity 0.6s ease;
  }

  .intro.revealed {
    opacity: 0.4;
  }

  /* ── TYPED CURSOR ── */
  .cursor {
    display: inline-block;
    width: 2px;
    height: 0.85em;
    background: var(--black);
    margin-left: 2px;
    animation: blink 0.7s step-end infinite;
    vertical-align: text-bottom;
  }

  .cursor.hidden { display: none; }

  @keyframes blink {
    50% { opacity: 0; }
  }

  /* ── NAVIGATION OBJECTS ── */
  .nav-objects {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 5;
  }

  .nav-item {
    position: absolute;
    pointer-events: all;
    cursor: pointer;
    text-decoration: none;
    color: var(--black);
    transition: transform 1.6s cubic-bezier(0.23, 1, 0.32, 1), opacity 0.6s ease;
    opacity: 0;
    transform-origin: center;
  }

  .nav-item.revealed {
    opacity: 1;
  }

  .nav-item:hover {
    transition: transform 0.35s cubic-bezier(0.23, 1, 0.32, 1), opacity 0.6s ease;
    transform: scale(1.03) !important;
  }

  .nav-about:hover {
    transform: scale(2) !important;
  }

  .nav-item:hover .nav-label {
    opacity: 1;
  }

  .nav-item:hover .item-image {
    transition: filter 0.3s, transform 0.35s cubic-bezier(0.23, 1, 0.32, 1);
    filter: grayscale(0);
  }

  .item-image {
    width: 180px;
    height: auto;
    display: block;
    filter: grayscale(0.3);
    transition: filter 1.2s, transform 1.6s cubic-bezier(0.23, 1, 0.32, 1);
  }

  .nav-label {
    display: none;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--black);
    opacity: 0.4;
    margin-top: 10px;
    text-align: center;
    transition: opacity 0.3s;
  }

  /* Positions — desktop: anchored 100px from page edges */
  .nav-work {
    top: 50%;
    left: 100px;
    transform: translateY(-50%) rotate(-2deg);
  }

  .nav-creative {
    top: 20%;
    right: 100px;
    transform: rotate(1.5deg);
  }

  .nav-about {
    top: 16%;
    left: 100px;
    transform: rotate(1deg);
  }

  .nav-presets {
    bottom: 12%;
    left: 100px;
    transform: rotate(-1.5deg);
  }

  .nav-blog {
    bottom: 12%;
    right: 100px;
    transform: rotate(2deg);
  }

  .nav-film {
    bottom: 4%;
    left: 50%;
    right: auto;
    transform: translateX(-50%) rotate(15deg);
  }

  .nav-film .item-image {
    width: 270px;
  }

  /* ── VIDEO BACKGROUND ── */
  .video-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    opacity: 0;
    transition: opacity 0.8s ease;
    pointer-events: none;
    background: #0a0a0a;
  }

  .video-bg video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .video-bg.active {
    opacity: 1;
  }

  body.video-mode {
    background: #0a0a0a;
  }

  body.video-mode .nav-links a {
    color: var(--white);
  }

  body.video-mode .socials a {
    color: rgba(255,255,255,0.5);
    border-color: rgba(255,255,255,0.15);
  }

  body.video-mode .socials a:hover {
    color: var(--sage);
    border-color: var(--sage);
  }

  body.video-mode .name .char { color: var(--white); }
  body.video-mode .intro { color: var(--white); }
  body.video-mode .intro.revealed { opacity: 0.85; }
  body.video-mode .cursor { background: var(--white); }
  body.video-mode .nav-label { color: var(--white); }
  body.video-mode .item-image { filter: grayscale(0.5) brightness(0.8); }
  body.video-mode .nav-item:hover .item-image { filter: grayscale(0) brightness(1); }

  .reel-status {
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.06em;
    color: var(--black);
    opacity: 0.3;
    margin-top: 4px;
    text-align: center;
    transition: opacity 0.3s, color 0.3s;
  }

  body.video-mode .reel-status {
    color: var(--white);
    opacity: 0.5;
  }

  /* ── ANIMATIONS ── */
  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    25% { background-position: 100% 0%; }
    50% { background-position: 100% 100%; }
    75% { background-position: 0% 100%; }
    100% { background-position: 0% 50%; }
  }

  /* ── INTRO GATE ── */
  #intro-gate {
    position: fixed;
    inset: 0;
    z-index: 10000;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.6s ease, background-color 0.08s linear;
  }

  #intro-gate.flash { background: #fff; }
  #intro-gate.flash #intro-video { opacity: 0; }

  #intro-gate.exiting {
    opacity: 0;
    pointer-events: none;
  }

  /* Lift the hero content above the gate while the intro is playing,
     so title + subtitle animate in visibly over the video. */
  body.intro-active .center-content {
    z-index: 10001;
  }

  /* ── MASTHEAD (transparent → black on hover) ── */
  .masthead {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 50;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 24px;
    background: transparent;
    color: var(--gray-40);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    opacity: 0;
    transition: opacity 0.6s ease, background-color 0.3s ease, color 0.3s ease;
  }
  .masthead.revealed { opacity: 1; }
  .masthead:hover {
    background: var(--black);
    color: var(--white);
  }

  .masthead .left,
  .masthead .right { display: flex; gap: 18px; align-items: center; }

  .masthead-nav { display: flex; gap: 16px; }
  .masthead-nav a {
    color: inherit;
    text-decoration: none;
    opacity: 1;
    transition: opacity 0.3s ease;
  }
  /* On bar-hover, dim non-focused links so the cursor target stands out */
  .masthead:hover .masthead-nav a { opacity: 0.6; }
  .masthead:hover .masthead-nav a:hover { opacity: 1; }

  .masthead .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #c8302e;
    box-shadow: 0 0 10px #c8302e;
    animation: pulse-dot 1.4s ease-in-out infinite;
  }
  @keyframes pulse-dot { 50% { opacity: 0.3; } }

  /* ── EXPOSURE READOUT (top-right) ── */
  .exposure {
    position: fixed;
    top: 56px;
    right: 24px;
    z-index: 40;
    text-align: right;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    line-height: 1.7;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--gray-70);
    opacity: 0;
    transition: opacity 0.6s ease, color 0.3s ease;
    pointer-events: none;
    min-width: 200px;
  }
  .exposure.revealed { opacity: 1; }
  .exposure-row { white-space: nowrap; min-height: 1.7em; }
  .exposure-row:first-child {
    color: var(--black);
    font-weight: 700;
  }
  .exposure-row.typing::after {
    content: '_';
    margin-left: 2px;
    color: #c8302e;
    animation: blink 0.6s step-end infinite;
  }

  body.video-mode .exposure { color: rgba(255,255,255,0.6); }
  body.video-mode .exposure-row:first-child { color: var(--white); }

  /* ── CHROMATIC ABERRATION ON HERO NAME ── */
  .name .char.revealed {
    text-shadow:
      1.5px 0 0 rgba(200, 48, 46, 0.45),
      -1.5px 0 0 rgba(45, 120, 130, 0.28);
  }
  body.video-mode .name .char.revealed {
    text-shadow:
      1.5px 0 0 rgba(232, 84, 82, 0.55),
      -1.5px 0 0 rgba(120, 200, 210, 0.35);
  }

  #intro-video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity 0.25s ease;
  }

  #intro-gate.playing #intro-video { opacity: 0.75; }
  #intro-gate.playing .intro-splash { opacity: 0; pointer-events: none; }

  .intro-splash {
    position: relative;
    z-index: 2;
    text-align: center;
    color: #fff;
    transition: opacity 0.3s ease;
  }

  .intro-enter {
    font-family: 'Archivo', sans-serif;
    font-size: clamp(36px, 7vw, 80px);
    font-weight: 900;
    letter-spacing: -0.05em;
    line-height: 0.9;
    text-transform: uppercase;
    color: #fff;
    background: transparent;
    border: none;
    outline: none;
    appearance: none;
    -webkit-appearance: none;
    padding: 0;
    cursor: pointer;
    opacity: 0.85;
    transition: opacity 0.35s cubic-bezier(0.23, 1, 0.32, 1);
  }

  .intro-enter:hover,
  .intro-enter:focus { opacity: 1; }
  .intro-enter::-moz-focus-inner { border: 0; }

  .intro-hint {
    margin-top: 28px;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.02em;
    color: rgba(255,255,255,0.4);
    text-transform: uppercase;
  }

  .intro-skip {
    position: absolute;
    bottom: 24px;
    right: 24px;
    z-index: 3;
    font-family: 'Archivo', sans-serif;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.12em;
    color: rgba(255,255,255,0.5);
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 8px 12px;
    opacity: 0;
    transition: opacity 0.3s ease, color 0.3s ease;
  }

  #intro-gate.playing .intro-skip { opacity: 1; }
  .intro-skip:hover { color: #fff; }

  /* ── RESPONSIVE ── */
  @media (max-width: 900px) {
    .nav-work { left: 40px; }
    .nav-creative { right: 40px; }
    .nav-about { left: 40px; }
    .nav-presets { left: 40px; }
    .nav-blog { right: 40px; }
    .item-image { width: 120px; }
  }

  @media (max-width: 640px) {
    nav {
      top: 14px;
      right: 16px;
    }

    .nav-links { gap: 16px; }
    .nav-links a { font-size: 10px; }

    .canvas {
      flex-direction: column;
      min-height: auto;
      padding: 80px 0 40px;
    }

    .nav-objects {
      position: relative;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      padding: 24px 16px;
      margin-top: 16px;
    }

    .nav-item {
      position: relative !important;
      top: auto !important;
      left: auto !important;
      right: auto !important;
      bottom: auto !important;
      transform: none !important;
    }

    .item-image { width: 140px; }

    .nav-label { display: block; }

    .center-content {
      padding: 20px 16px;
    }
  }
</style>
</head>

      <img class="item-image" src="https://images.unsplash.com/photo-1517336714731-489689fd1ca8?w=400&q=80&auto=format" alt="MacBook Pro" loading="eager">
      <div class="nav-label">WORK</div>

    <!-- Leica M6 → Creative / Photography -->

      <img class="item-image" src="imgs/Leica Background Removed.png" alt="Leica M6" loading="eager">
      <div class="nav-label">CREATIVE</div>
    </a>

    <!-- About / Bio -->

      <img class="item-image" src="imgs/6BEFCA39-A871-4CCB-86B2-DC4E9A9D9728-labbet-app.JPG" alt="About" loading="lazy">
      <div class="nav-label">ABOUT</div>

      <img class="item-image" src="imgs/png-clipart-graphic-film-kodak-portra-graphy-camera-film-35-mm Background Removed.png" alt="Photography Presets" loading="lazy" style="transform: rotate(30deg);">
      <div class="nav-label">PRESET SHOP</div>
    </a>

    <!-- Blog -->
    <a href="blog.html" class="nav-item nav-blog" id="navBlog">
      <img class="item-image" src="imgs/IMG_8796 Background Removed.png" alt="Travel Blog" loading="lazy">
      <div class="nav-label">BLOG</div>
    </a>

    <!-- Super 8 → Film / Video -->
    <button class="nav-item nav-film" id="reelBtn" style="border: none; background: none; font-family: inherit; text-transform: uppercase; letter-spacing: -0.02em; cursor: pointer;">
      <img class="item-image" src="imgs/IMG_8794 Background Removed.png" alt="Super 8 Camera" loading="eager">
      <div class="nav-label">FILM</div>
      <div class="reel-status" id="reelStatus">CLICK TO PLAY</div>
    </button>

  </div>
</div>

<script>
(function() {
  // ── TYPED NAME ANIMATION ──
  const nameEl = document.getElementById('nameEl');
  const introEl = document.getElementById('introEl');
  const cursor = document.getElementById('cursor');
  const nameText = 'TOM JENKINSON';
  let charIndex = 0;

  // Build character spans
  nameText.split('').forEach(ch => {
    if (ch === ' ') {
      const span = document.createElement('span');
      span.className = 'space';
      nameEl.appendChild(span);
    } else {
      const span = document.createElement('span');
      span.className = 'char';
      span.textContent = ch;
      nameEl.appendChild(span);
    }
  });

  const chars = nameEl.querySelectorAll('.char');

  function typeNext() {
    if (charIndex < chars.length) {
      chars[charIndex].classList.add('revealed');
      charIndex++;
      setTimeout(typeNext, 70 + Math.random() * 40);
    } else {
      // Name finished — reveal the intro paragraph. Socials/nav items wait for Phase 2.
      setTimeout(() => introEl.classList.add('revealed'), 200);
    }
  }

  // Phase 1: name + intro. Fires on ENTER click so it animates during the video.
  window.startHomeIntro = function() {
    if (window.__phase1Started) return;
    window.__phase1Started = true;
    setTimeout(typeNext, 300);
  };

  // ── MASTHEAD DATE ──
  (function() {
    const dateEl = document.getElementById('masthead-date');
    if (!dateEl) return;
    const d = new Date();
    const pad = n => String(n).padStart(2, '0');
    dateEl.textContent = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  })();

  // ── EXPOSURE READOUT (per-icon profiles, typed out on hover) ──
  const EXPOSURE_PROFILES = {
    default:     ['EXP. 1/250',  'F2.8 · ISO 400',   'LEICA M6 / TRI-X 400'],
    navWork:     ['EXP. 1/60',   'F4.0 · ISO 800',   'MBP M3 / DAYLIGHT'],
    navCreative: ['EXP. 1/500',  'F2.0 · ISO 100',   'LEICA M6 / EKTAR 100'],
    navAbout:    ['EXP. 1/125',  'F2.8 · ISO 200',   'PORTRA 400 / SUMMICRON 50'],
    navPresets:  ['EXP. 1/1000', 'F5.6 · ISO 100',   'EKTAR 100 / 35MM'],
    navBlog:     ['EXP. 1/2000', 'F8.0 · ISO 200',   'RICOH GR III / DAYLIGHT'],
    reelBtn:     ['18 FPS',      'F2.8 · TRI-X 200', 'SUPER 8 / KODAK']
  };

  let exposureTimers = [];
  function clearExposureTyping() {
    exposureTimers.forEach(clearTimeout);
    exposureTimers = [];
    document.querySelectorAll('.exposure-row').forEach(r => r.classList.remove('typing'));
  }
  function typeExposure(profile) {
    clearExposureTyping();
    const rows = document.querySelectorAll('.exposure-row');
    rows.forEach((row, i) => {
      const text = profile[i] || '';
      row.textContent = '';
      row.classList.add('typing');
      const start = i * 70;
      for (let j = 0; j < text.length; j++) {
        const ch = text[j];
        exposureTimers.push(setTimeout(() => {
          row.textContent += ch;
        }, start + j * 18));
      }
      exposureTimers.push(setTimeout(() => {
        row.classList.remove('typing');
      }, start + text.length * 18 + 120));
    });
  }

  function bindExposureHovers() {
    Object.keys(EXPOSURE_PROFILES).forEach(id => {
      if (id === 'default') return;
      const el = document.getElementById(id);
      if (!el) return;
      el.addEventListener('mouseenter', () => typeExposure(EXPOSURE_PROFILES[id]));
      el.addEventListener('mouseleave', () => typeExposure(EXPOSURE_PROFILES.default));
    });
  }
  bindExposureHovers();

  // ── HOVER TITLE (large typed-out label on nav-item hover) ──
  const HOVER_TITLES = {
    navWork: 'WORK',
    navCreative: 'CREATIVE',
    navAbout: 'ABOUT',
    navPresets: 'PRESET SHOP',
    navBlog: 'BLOG',
    reelBtn: 'FILM'
  };
  const hoverTitleEl = document.getElementById('hoverTitle');
  let hoverTitleTimers = [];
  function clearHoverTitle() {
    hoverTitleTimers.forEach(clearTimeout);
    hoverTitleTimers = [];
    hoverTitleEl.textContent = '';
    hoverTitleEl.classList.remove('active');
  }
  function typeHoverTitle(text) {
    clearHoverTitle();
    hoverTitleEl.classList.add('active');
    for (let j = 0; j < text.length; j++) {
      const ch = text[j];
      hoverTitleTimers.push(setTimeout(() => {
        hoverTitleEl.textContent += ch;
      }, j * 45));
    }
  }
  Object.keys(HOVER_TITLES).forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    el.addEventListener('mouseenter', () => typeHoverTitle(HOVER_TITLES[id]));
    el.addEventListener('mouseleave', clearHoverTitle);
    el.addEventListener('focus', () => typeHoverTitle(HOVER_TITLES[id]));
    el.addEventListener('blur', clearHoverTitle);
  });

  // Phase 2: socials + nav items + hide cursor + masthead/exposure. Fires after video ends.
  window.startHomeIntroPhase2 = function() {
    if (window.__phase2Started) return;
    window.__phase2Started = true;
    document.getElementById('masthead').classList.add('revealed');
    const exposureEl = document.getElementById('exposure');
    exposureEl.classList.add('revealed');
    typeExposure(EXPOSURE_PROFILES.default);
    document.getElementById('socials').classList.add('revealed');
    const items = ['navCreative', 'navAbout', 'navPresets', 'navBlog', 'reelBtn'];
    items.forEach((id, i) => {
      setTimeout(() => {
        document.getElementById(id).classList.add('revealed');
        if (i === items.length - 1) {
          setTimeout(() => cursor.classList.add('hidden'), 800);
        }
      }, i * 130);
    });
  };

  // Convenience for the no-video path (reduced-motion, returning visitors, video errors)
  window.startHomeIntroAuto = function() {
    window.startHomeIntro();
    setTimeout(window.startHomeIntroPhase2, 1800);
  };

  if (!document.getElementById('intro-gate')) {
    window.startHomeIntroAuto();
  }

  // ── PRESET PAGE TRANSITION (FLIP) ──
  var navPresets = document.getElementById('navPresets');
  navPresets.addEventListener('click', function(e) {
    e.preventDefault();
    var href = this.getAttribute('href');
    var img  = this.querySelector('.item-image');
    var r    = (img || this).getBoundingClientRect();

    // Store thumbnail rect for FLIP animation on the destination page
    try {
      sessionStorage.setItem('preset-flip-rect', JSON.stringify({
        top: r.top, left: r.left, width: r.width, height: r.height
      }));
    } catch (ex) {}

    // Brief white flash then navigate
    var flash = document.createElement('div');
    flash.style.cssText = 'position:fixed;inset:0;background:#fff;z-index:9999;opacity:0;pointer-events:none;transition:opacity 0.12s linear';
    document.body.appendChild(flash);
    requestAnimationFrame(function() {
      requestAnimationFrame(function() {
        flash.style.opacity = '1';
      });
    });
    setTimeout(function() { window.location.href = href; }, 130);
  });

  // ── FILM REEL CYCLE ──
  // Click → turn on + play first video. Each subsequent click advances.
  // After the last reel, one more click ends video mode and resets to the start.
  const reelBtn = document.getElementById('reelBtn');
  const videoBg = document.getElementById('videoBg');
  const bgVideo = document.getElementById('bgVideo');
  const reelStatus = document.getElementById('reelStatus');

  const VIDEO_SEQUENCE = [
    'video/arch2.mp4',
    'video/malawi.mp4',
    'video/road-to-nowhere.mp4'
  ];
  let videoIdx = -1;
  let preloaded = false;

  function preloadRest() {
    if (preloaded) return;
    preloaded = true;
    for (let i = 1; i < VIDEO_SEQUENCE.length; i++) {
      const v = document.createElement('video');
      v.preload = 'auto';
      v.muted = true;
      v.src = VIDEO_SEQUENCE[i];
      v.style.cssText = 'position:absolute;width:0;height:0;opacity:0;pointer-events:none;';
      document.body.appendChild(v);
      v.load();
    }
  }

  reelBtn.addEventListener('click', function(e) {
    e.preventDefault();

    if (videoIdx === -1) {
      // Off → first reel
      videoIdx = 0;
      videoBg.classList.add('active');
      document.body.classList.add('video-mode');
      preloadRest();
    } else if (videoIdx < VIDEO_SEQUENCE.length - 1) {
      // Advance to next reel
      videoIdx++;
    } else {
      // Past the last reel → end the cycle, reset to off
      videoIdx = -1;
      videoBg.classList.remove('active');
      document.body.classList.remove('video-mode');
      bgVideo.pause();
      reelStatus.textContent = 'CLICK TO PLAY';
      return;
    }

    bgVideo.src = VIDEO_SEQUENCE[videoIdx];
    bgVideo.load();
    bgVideo.play().catch(() => {});

    const isLast = videoIdx === VIDEO_SEQUENCE.length - 1;
    reelStatus.textContent = isLast
      ? `CLICK TO STOP · ${videoIdx + 1} / ${VIDEO_SEQUENCE.length}`
      : `NEXT REEL · ${videoIdx + 1} / ${VIDEO_SEQUENCE.length}`;
  });
})();
</script>

<script>
// ── INTRO GATE CONTROLLER ──
(function() {
  const SESSION_KEY = 'intro-seen';
  const gate = document.getElementById('intro-gate');
  if (!gate) return;

  const video = document.getElementById('intro-video');
  const enterBtn = document.getElementById('intro-enter');
  const skipBtn = document.getElementById('intro-skip');
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const alreadySeen = (function() { try { return sessionStorage.getItem(SESSION_KEY); } catch (e) { return null; } })();

  function markSeen() {
    try { sessionStorage.setItem(SESSION_KEY, '1'); } catch (e) {}
  }

  function finishAndExit(withFlash) {
    markSeen();
    try { video.pause(); } catch (e) {}
    gate.setAttribute('aria-hidden', 'true');

    // Drop the inverted-color mode so text returns to its normal (black) styling.
    // Doing this at the flash moment means the color change is hidden behind the white.
    document.body.classList.remove('video-mode');

    if (withFlash) gate.classList.add('flash');
    if (typeof window.startHomeIntroPhase2 === 'function') window.startHomeIntroPhase2();

    const holdMs = withFlash ? 140 : 0;
    setTimeout(function() {
      gate.classList.add('exiting');
      gate.addEventListener('transitionend', function onEnd(e) {
        if (e.propertyName !== 'opacity') return;
        gate.removeEventListener('transitionend', onEnd);
        gate.remove();
        document.body.classList.remove('intro-active');
      });
    }, holdMs);
  }

  function skipImmediately() {
    markSeen();
    gate.remove();
    document.body.classList.remove('intro-active', 'video-mode');
    if (typeof window.startHomeIntroAuto === 'function') window.startHomeIntroAuto();
  }

  if (reducedMotion || alreadySeen) {
    skipImmediately();
    return;
  }

  enterBtn.addEventListener('click', function() {
    document.body.classList.add('intro-active', 'video-mode');
    gate.classList.add('playing');
    video.muted = false;
    if (typeof window.startHomeIntro === 'function') window.startHomeIntro();
    const p = video.play();
    if (p && typeof p.catch === 'function') {
      p.catch(function() {
        // Autoplay-with-sound refused — retry muted so the visual still plays
        video.muted = true;
        video.play().catch(skipImmediately);
      });
    }
  });

  video.addEventListener('ended', function() { finishAndExit(true); });
  video.addEventListener('error', skipImmediately);

  skipBtn.addEventListener('click', function() { finishAndExit(false); });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && document.body.contains(gate)) finishAndExit(false);
  });
})();
</script>

<script>
// ── P5.JS GRAIN ──
new p5(function(p) {
  var SCALE = 4;
  var gw, gh;

  p.setup = function() {
    p.pixelDensity(1);
    gw = Math.floor(p.windowWidth  / SCALE);
    gh = Math.floor(p.windowHeight / SCALE);
    var c = p.createCanvas(gw, gh);
    c.parent('grain-container');
    c.elt.style.width  = '100%';
    c.elt.style.height = '100%';
    p.frameRate(14);
    p.noSmooth();
  };

  p.draw = function() {
    p.loadPixels();
    var len = p.pixels.length;
    for (var i = 0; i < len; i += 4) {
      var v = p.random(255);
      p.pixels[i]     = v;
      p.pixels[i + 1] = v;
      p.pixels[i + 2] = v;
      p.pixels[i + 3] = p.random(80);
    }
    p.updatePixels();
  };

  p.windowResized = function() {
    gw = Math.floor(p.windowWidth  / SCALE);
    gh = Math.floor(p.windowHeight / SCALE);
    p.resizeCanvas(gw, gh);
  };
});
</script>
