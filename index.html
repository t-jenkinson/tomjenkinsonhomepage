<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tom Jenkinson</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
<style>
  :root {
    --white: #ffffff;
    --black: #0a0a0a;
    --sage: #7d9a82;
    --gray-100: rgba(10, 10, 10, 1);
    --gray-70: rgba(10, 10, 10, 0.7);
    --gray-40: rgba(10, 10, 10, 0.4);
    --gray-15: rgba(10, 10, 10, 0.15);
    --gray-08: rgba(10, 10, 10, 0.08);
    --gray-04: rgba(10, 10, 10, 0.04);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  #grain-container {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 500;
    mix-blend-mode: multiply;
    opacity: 0.07;
  }

  body {
    font-family: 'Archivo', sans-serif;
    background: var(--white);
    color: var(--black);
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    text-transform: uppercase;
    letter-spacing: -0.02em;
  }

  /* ── FLOATING MENU ── */
  nav {
    position: fixed;
    top: 20px;
    right: 24px;
    z-index: 100;
    display: flex;
    align-items: center;
    gap: 28px;
  }

  .nav-links {
    display: flex;
    gap: 24px;
    list-style: none;
  }

  .nav-links a {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.02em;
    color: var(--black);
    text-decoration: none;
    opacity: 0.4;
    transition: opacity 0.3s;
  }

  .nav-links a:hover { opacity: 1; }

  /* ── SOCIAL ICONS (below subtitle) ── */
  .socials {
    display: flex;
    justify-content: center;
    gap: 14px;
    margin-top: 24px;
    opacity: 0;
    transition: opacity 0.6s ease;
  }

  .socials.revealed {
    opacity: 1;
  }

  .socials a {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1.5px solid var(--gray-15);
    color: var(--black);
    opacity: 0.4;
    text-decoration: none;
    transition: all 0.35s cubic-bezier(0.23, 1, 0.32, 1);
  }

  .socials a:hover {
    opacity: 1;
    color: var(--sage);
    border-color: var(--sage);
    transform: scale(1.3) rotate(6deg);
  }

  .socials a svg {
    width: 15px;
    height: 15px;
    fill: currentColor;
    transition: fill 0.35s;
  }

  /* ── MAIN CANVAS ── */
  .canvas {
    position: relative;
    width: 100%;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding-top: 0;
  }

  /* ── CENTER CONTENT ── */
  .center-content {
    position: relative;
    z-index: 10;
    text-align: center;
    max-width: 700px;
    padding: 40px 24px;
  }

  .name {
    font-size: clamp(36px, 7vw, 80px);
    font-weight: 900;
    letter-spacing: -0.05em;
    line-height: 0.9;
    color: var(--black);
    margin-bottom: 28px;
    white-space: nowrap;
  }

  .name .char {
    display: inline-block;
    opacity: 0;
    transform: translateY(100%);
  }

  .name .char.revealed {
    opacity: 1;
    transform: translateY(0);
    transition: opacity 0.05s, transform 0.2s cubic-bezier(0.23, 1, 0.32, 1);
  }

  .name .space {
    display: inline-block;
    width: 0.25em;
  }

  .intro {
    font-size: clamp(11px, 1.4vw, 13px);
    font-weight: 500;
    line-height: 1.7;
    color: var(--black);
    opacity: 0;
    max-width: 460px;
    margin: 0 auto;
    letter-spacing: 0.01em;
    transition: opacity 0.6s ease;
  }

  .intro.revealed {
    opacity: 0.4;
  }

  /* ── TYPED CURSOR ── */
  .cursor {
    display: inline-block;
    width: 2px;
    height: 0.85em;
    background: var(--black);
    margin-left: 2px;
    animation: blink 0.7s step-end infinite;
    vertical-align: text-bottom;
  }

  .cursor.hidden { display: none; }

  @keyframes blink {
    50% { opacity: 0; }
  }

  /* ── NAVIGATION OBJECTS ── */
  .nav-objects {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 5;
  }

  .nav-item {
    position: absolute;
    pointer-events: all;
    cursor: pointer;
    text-decoration: none;
    color: var(--black);
    transition: transform 0.4s cubic-bezier(0.23, 1, 0.32, 1), opacity 0.6s ease;
    opacity: 0;
    transform-origin: center;
  }

  .nav-item.revealed {
    opacity: 1;
  }

  .nav-item:hover {
    transform: scale(1.03) !important;
  }

  .nav-item:hover .nav-label {
    opacity: 1;
  }

  .nav-item:hover .item-image {
    filter: grayscale(0);
  }

  .item-image {
    width: 180px;
    height: auto;
    display: block;
    border-radius: 6px;
    filter: grayscale(0.3);
    transition: filter 0.4s, transform 0.4s cubic-bezier(0.23, 1, 0.32, 1);
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
  }

  .nav-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--black);
    opacity: 0.4;
    margin-top: 10px;
    text-align: center;
    transition: opacity 0.3s;
  }

  /* Positions — desktop: anchored 100px from page edges */
  .nav-work {
    top: 50%;
    left: 100px;
    transform: translateY(-50%) rotate(-2deg);
  }

  .nav-creative {
    top: 20%;
    right: 100px;
    transform: rotate(1.5deg);
  }

  .nav-about {
    top: 16%;
    left: 100px;
    transform: rotate(1deg);
  }

  .nav-presets {
    bottom: 12%;
    left: 100px;
    transform: rotate(-1.5deg);
  }

  .nav-blog {
    bottom: 12%;
    right: 100px;
    transform: rotate(2deg);
  }

  .nav-film {
    bottom: 55%;
    right: 100px;
    transform: rotate(-1deg);
  }

  /* ── VIDEO BACKGROUND ── */
  .video-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    opacity: 0;
    transition: opacity 0.8s ease;
    pointer-events: none;
    background: linear-gradient(135deg, #0a0a0a, #1a1a2e, #0f3460, #0a0a0a);
    background-size: 400% 400%;
  }

  .video-bg.active {
    opacity: 1;
    animation: gradientShift 8s ease infinite;
  }

  body.video-mode {
    background: #0a0a0a;
  }

  body.video-mode .nav-links a {
    color: var(--white);
  }

  body.video-mode .socials a {
    color: rgba(255,255,255,0.5);
    border-color: rgba(255,255,255,0.15);
  }

  body.video-mode .socials a:hover {
    color: var(--sage);
    border-color: var(--sage);
  }

  body.video-mode .name .char { color: var(--white); }
  body.video-mode .intro { color: var(--white); }
  body.video-mode .cursor { background: var(--white); }
  body.video-mode .nav-label { color: var(--white); }
  body.video-mode .item-image { filter: grayscale(0.5) brightness(0.8); }
  body.video-mode .nav-item:hover .item-image { filter: grayscale(0) brightness(1); }

  .reel-status {
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.06em;
    color: var(--black);
    opacity: 0.3;
    margin-top: 4px;
    text-align: center;
    transition: opacity 0.3s, color 0.3s;
  }

  body.video-mode .reel-status {
    color: var(--white);
    opacity: 0.5;
  }

  /* ── ANIMATIONS ── */
  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    25% { background-position: 100% 0%; }
    50% { background-position: 100% 100%; }
    75% { background-position: 0% 100%; }
    100% { background-position: 0% 50%; }
  }

  /* ── RESPONSIVE ── */
  @media (max-width: 900px) {
    .nav-work { left: 40px; }
    .nav-creative { right: 40px; }
    .nav-about { left: 40px; }
    .nav-presets { left: 40px; }
    .nav-blog { right: 40px; }
    .nav-film { right: 40px; }
    .item-image { width: 120px; }
  }

  @media (max-width: 640px) {
    nav {
      top: 14px;
      right: 16px;
    }

    .nav-links { gap: 16px; }
    .nav-links a { font-size: 10px; }

    .canvas {
      flex-direction: column;
      min-height: auto;
      padding: 80px 0 40px;
    }

    .nav-objects {
      position: relative;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      padding: 24px 16px;
      margin-top: 16px;
    }

    .nav-item {
      position: relative !important;
      top: auto !important;
      left: auto !important;
      right: auto !important;
      bottom: auto !important;
      transform: none !important;
    }

    .item-image { width: 140px; }

    .center-content {
      padding: 20px 16px;
    }
  }
</style>
</head>
<body>

<!-- ── FLOATING MENU (top-right) ── -->

  <ul class="nav-links">

<div class="canvas">

<script>
(function() {
  // ── TYPED NAME ANIMATION ──
  const nameEl = document.getElementById('nameEl');
  const introEl = document.getElementById('introEl');
  const cursor = document.getElementById('cursor');
  const nameText = 'TOM JENKINSON';
  let charIndex = 0;

  // Build character spans
  nameText.split('').forEach(ch => {
    if (ch === ' ') {
      const span = document.createElement('span');
      span.className = 'space';
      nameEl.appendChild(span);
    } else {
      const span = document.createElement('span');
      span.className = 'char';
      span.textContent = ch;
      nameEl.appendChild(span);
    }
  });

  const chars = nameEl.querySelectorAll('.char');

  function typeNext() {
    if (charIndex < chars.length) {
      chars[charIndex].classList.add('revealed');
      charIndex++;
      setTimeout(typeNext, 50 + Math.random() * 30);
    } else {
      // After name is typed, reveal intro + socials
      setTimeout(() => {
        introEl.classList.add('revealed');
        setTimeout(() => {
          document.getElementById('socials').classList.add('revealed');
        }, 300);
        // Reveal nav items with stagger
        const items = ['navWork', 'navCreative', 'navAbout', 'navPresets', 'navBlog', 'reelBtn'];
        items.forEach((id, i) => {
          setTimeout(() => {
            document.getElementById(id).classList.add('revealed');
            if (i === items.length - 1) {
              setTimeout(() => cursor.classList.add('hidden'), 800);
            }
          }, 400 + i * 150);
        });
      }, 300);
    }
  }

  // Start typing after a brief pause
  setTimeout(typeNext, 400);

  // ── PRESET PAGE TRANSITION (FLIP) ──
  var navPresets = document.getElementById('navPresets');
  navPresets.addEventListener('click', function(e) {
    e.preventDefault();
    var href = this.getAttribute('href');
    var img  = this.querySelector('.item-image');
    var r    = (img || this).getBoundingClientRect();

    // Store thumbnail rect for FLIP animation on the destination page
    try {
      sessionStorage.setItem('preset-flip-rect', JSON.stringify({
        top: r.top, left: r.left, width: r.width, height: r.height
      }));
    } catch (ex) {}

    // Brief white flash then navigate
    var flash = document.createElement('div');
    flash.style.cssText = 'position:fixed;inset:0;background:#fff;z-index:9999;opacity:0;pointer-events:none;transition:opacity 0.12s linear';
    document.body.appendChild(flash);
    requestAnimationFrame(function() {
      requestAnimationFrame(function() {
        flash.style.opacity = '1';
      });
    });
    setTimeout(function() { window.location.href = href; }, 130);
  });

  // ── FILM REEL TOGGLE ──
  const reelBtn = document.getElementById('reelBtn');
  const videoBg = document.getElementById('videoBg');
  const reelStatus = document.getElementById('reelStatus');
  let isPlaying = false;

  reelBtn.addEventListener('click', function(e) {
    e.preventDefault();
    isPlaying = !isPlaying;
    videoBg.classList.toggle('active', isPlaying);
    document.body.classList.toggle('video-mode', isPlaying);
    reelStatus.textContent = isPlaying ? 'CLICK TO STOP' : 'CLICK TO PLAY';
  });
})();
</script>

<script>
// ── P5.JS GRAIN ──
new p5(function(p) {
  var SCALE = 4;
  var gw, gh;

  p.setup = function() {
    p.pixelDensity(1);
    gw = Math.floor(p.windowWidth  / SCALE);
    gh = Math.floor(p.windowHeight / SCALE);
    var c = p.createCanvas(gw, gh);
    c.parent('grain-container');
    c.elt.style.width  = '100%';
    c.elt.style.height = '100%';
    p.frameRate(14);
    p.noSmooth();
  };

  p.draw = function() {
    p.loadPixels();
    var len = p.pixels.length;
    for (var i = 0; i < len; i += 4) {
      var v = p.random(255);
      p.pixels[i]     = v;
      p.pixels[i + 1] = v;
      p.pixels[i + 2] = v;
      p.pixels[i + 3] = p.random(80);
    }
    p.updatePixels();
  };

  p.windowResized = function() {
    gw = Math.floor(p.windowWidth  / SCALE);
    gh = Math.floor(p.windowHeight / SCALE);
    p.resizeCanvas(gw, gh);
  };
});
</script>
